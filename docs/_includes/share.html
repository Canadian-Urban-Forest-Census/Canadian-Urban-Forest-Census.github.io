{%- comment -%} Share buttons (LinkedIn, X, copy link). Used near the bottom of most pages. {%- endcomment -%}
<div class="share">
	<span class="share-label">Share</span>

	<a id="share-linkedin" href="#" target="_blank" rel="noopener noreferrer">
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.47-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/></svg>
		LinkedIn
	</a>

	<a id="share-x" href="#" target="_blank" rel="noopener noreferrer">
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.584-6.64 7.584H.47l8.6-9.83L0 1.15h7.6l5.24 6.93zm-1.29 19.5h2.04L6.49 3.24H4.3z"/></svg>
		X
	</a>

	<button id="share-copy" type="button">
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
		Copy link
	</button>

	<span id="copy-status" role="status"></span>
</div>

<script>
	(function () {
		var url = window.location.href.split("#")[0];
		var title = document.title;

		document.getElementById("share-linkedin").href =
			"https://www.linkedin.com/sharing/share-offsite/?url=" + encodeURIComponent(url);

		document.getElementById("share-x").href =
			"https://twitter.com/intent/tweet?url=" + encodeURIComponent(url) +
			"&text=" + encodeURIComponent(title);

		document.getElementById("share-copy").addEventListener("click", function () {
			var status = document.getElementById("copy-status");
			navigator.clipboard.writeText(url).then(function () {
				status.textContent = "Link copied";
				setTimeout(function () { status.textContent = ""; }, 2000);
			}).catch(function () {
				status.textContent = "Press Ctrl+C to copy: " + url;
			});
		});
	})();
</script>
